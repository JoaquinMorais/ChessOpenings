services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chess}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chess}"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
  db-test:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chess_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    profiles:
      - test
  backend-test:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db-test:5432/chess_test
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: pytest
    profiles:
      - test
volumes:
  pgdata: