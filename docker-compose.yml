services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chess}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chess}"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - ./.gitignore:/repo-root/.gitignore:ro
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
  backend-test:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/chess_test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./.gitignore:/repo-root/.gitignore:ro
    command: pytest
    profiles:
      - test
volumes:
  pgdata: